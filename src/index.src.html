.note{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}

.flw .s span{display:block;font-size:14.5px;color:var(--mut);margin-top:3px;line-height:1.45}

.flw .s.g{background:var(--green-t);border-color:transparent}.flw .s.o{background:var(--orange-t);border-color:transparent}.flw .s.y{background:var(--y2);border-color:transparent}

var BANDS=["0–5 meses","6–11 meses","1 año","2 a 4 años","5 años o más"];
function months(){
  if(!S.dob)return null;

  var n=new Date(),m=(n.getFullYear()-+p[0])*12+(n.getMonth()+1-+p[1])-(n.getDate()<+p[2]?1:0);
  return m<0?null:m;
}
function ageLabel(m){
  if(m==null)return "";
  if(m<24)return m+(m===1?" mes":" meses");
  var a=Math.floor(m/12),r=m%12;return a+(a===1?" año":" años")+(r?" y "+r+(r===1?" mes":" m"):"");
}
function band(){
  var m=months();
  if(m!=null)return m<6?0:m<12?1:m<24?2:m<60?3:4;
  if(S.pick!=null)return S.pick;
  return S.mode==="esp"?0:null;
}
function gate(){
  if(months()!=null||S.mode==="esp")return "";

  return h+'</div></div>';
}

var GEST=[
null,
["Comienza el ciclo","La semana 1 se cuenta desde el primer día de la última menstruación, antes de que exista el embarazo. El endometrio se descama y varios folículos del ovario empiezan a madurar por acción de la FSH.",""],
["Madura el óvulo","Un folículo domina y madura. Hacia el final de la semana, el pico de LH desencadena la ovulación: el ovocito es liberado y puede ser fecundado durante unas 12 a 24 horas.",""],
["Fecundación","El espermatozoide penetra el ovocito y se forma el cigoto, con 46 cromosomas y el sexo genético ya definido. Comienzan las primeras divisiones (segmentación) mientras avanza por la trompa de Falopio. Hacia el día 3 o 4 es una mórula.","≈ 0,1 mm"],
["Implantación","El blastocisto, con embrioblasto y trofoblasto, se implanta en el endometrio unos 6 a 7 días después de la fecundación. El trofoblasto comienza a producir hCG, la hormona que detectan los tests de embarazo. Todavía es normal no sentir nada.","≈ 0,2 mm"],
["Disco trilaminar","En la gastrulación se forman las tres capas germinales: ectodermo, mesodermo y endodermo, de las que derivarán todos los tejidos. Aparece la línea primitiva y se induce la placa neural. Suele ser la semana del primer test positivo.","≈ 1–2 mm"],
["Late el corazón","El tubo neural se cierra y el tubo cardíaco empieza a latir. Se forman los somitas, origen de vértebras y músculos. Con ecografía transvaginal puede verse el saco gestacional y el embrión con latido.","CRL ≈ 4–6 mm"],
["Esbozos de brazos y ojos","Aparecen los esbozos de los miembros, las placodas ópticas y óticas y se cierra el neuroporo caudal. El corazón se pliega y se divide en cuatro cavidades. Son frecuentes las náuseas matutinas.","CRL ≈ 8–10 mm"],
["Manos, cara y párpados","Las extremidades se alargan y se forman las placas de manos y pies. Se esbozan párpados, nariz, paladar primario y pabellones auriculares. Los intestinos protruyen transitoriamente hacia el cordón (hernia fisiológica).","CRL ≈ 16 mm"],
["Dedos separados","Los dedos de manos y pies se separan y la cola embrionaria desaparece. La cabeza es casi la mitad de la longitud del cuerpo. Los músculos se contraen y el embrión ya se mueve, aunque todavía no se siente.","CRL ≈ 23 mm"],
["Ya es un feto","Termina el período embrionario: los órganos principales están formados y desde ahora crecen y maduran. Los genitales externos comienzan a diferenciarse. El período de mayor sensibilidad a agentes que causan malformaciones va quedando atrás.","≈ 31 mm · 4 g"],
["Fin del primer trimestre","El feto se mueve con soltura. Se forman las uñas y los folículos pilosos; el hígado produce glóbulos rojos y los riñones empiezan a producir orina. Entre las semanas 11 y 13+6 se hace la ecografía del primer trimestre, con translucencia nucal.","≈ 41 mm · 7 g"],
["Primeros reflejos","Aparecen reflejos como la succión y el cierre del puño. Los ojos, antes laterales, se acercan al centro de la cara. Los intestinos vuelven a la cavidad abdominal. Disminuye el riesgo de pérdida espontánea.","≈ 54 mm · 14 g"],
["Cuerdas vocales y huellas","Se forman las huellas dactilares y las cuerdas vocales. Los huesos empiezan a osificarse y la placenta ya asume la producción hormonal. Para muchas personas ceden las náuseas y vuelve la energía.","≈ 66 mm · 23 g"],
["Comienza el segundo trimestre","El cuello se alarga y la cabeza se sostiene más erguida. Aparece el lanugo, un vello fino, y el feto puede hacer gestos y llevarse el pulgar a la boca.","≈ 8,7 cm · 43 g"],
["Percibe la luz","La retina empieza a ser sensible a la luz y se desarrollan los huesitos del oído. Se forman las papilas gustativas y los miembros alcanzan sus proporciones definitivas.","≈ 10 cm · 70 g"],
["Movimientos coordinados","El sistema musculoesquelético permite movimientos coordinados. El feto traga líquido amniótico, que ayuda a madurar el intestino y los pulmones. Algunas personas sienten los primeros movimientos, sobre todo si no es el primer embarazo.","≈ 11,6 cm · 100 g"],
["Grasa y esmalte","Se forma la grasa parda y los dientes comienzan a depositar esmalte. El cordón umbilical se fortalece y la piel empieza a cubrirse de vérnix caseoso, una capa que la protege.","≈ 13 cm · 140 g"],
["Escucha por primera vez","El oído interno está desarrollado y percibe sonidos y vibraciones. En las niñas se completa la formación del útero y las trompas. Los movimientos pueden sentirse como burbujas o aleteos.","≈ 14 cm · 190 g"],
["Piel y vérnix","La piel se cubre de vérnix y lanugo. Los sentidos del tacto, gusto, olfato, vista y oído se organizan en áreas específicas del cerebro. Los pulmones desarrollan los bronquiolos.","≈ 15 cm · 240 g"],
["Mitad del embarazo","Entre las semanas 20 y 22 suele hacerse la ecografía morfológica, que revisa en detalle cerebro, corazón, columna, riñones y placenta. Los movimientos son cada vez más claros.","≈ 25 cm · 300 g"],
["Ciclos de sueño y vigilia","Aparecen períodos de reposo y de actividad. La médula ósea se suma a la formación de células sanguíneas. Las cejas y las pestañas ya están presentes.","≈ 27 cm · 360 g"],
["Ojos y labios definidos","Los ojos están formados aunque el iris todavía carece de pigmento. Los pulmones desarrollan los sacos terminales y el feto responde con movimientos a los sonidos fuertes.","≈ 28 cm · 430 g"],
["Cerca de la viabilidad","Los pulmones empiezan a producir surfactante, aún en poca cantidad. Alrededor de las semanas 22 a 24 se ubica el límite de viabilidad: con cuidados intensivos neonatales algunos bebés sobreviven, con alto riesgo de secuelas.","≈ 29 cm · 500 g"],
["Los pulmones se preparan","Los neumocitos tipo II ya producen surfactante, esencial para respirar al nacer. Entre las semanas 24 y 28 suele hacerse la prueba de tolerancia a la glucosa para descartar diabetes gestacional.","≈ 30 cm · 600 g"],
["Reconoce voces","Distingue voces y sonidos, y los reflejos se afinan. Los capilares pulmonares se acercan a los alvéolos primitivos. Pueden aparecer contracciones de Braxton Hicks, irregulares e indoloras.","≈ 34 cm · 660 g"],
["Abre los ojos","Los párpados se separan y los ojos pueden abrirse. El cerebro empieza a plegarse en surcos y circunvoluciones, lo que amplía su superficie.","≈ 35 cm · 760 g"],
["El cerebro crece rápido","El cerebro crece de forma acelerada y se organiza en capas. El feto puede sobresaltarse con ruidos fuertes. Está por comenzar el tercer trimestre.","≈ 36 cm · 875 g"],
["Comienza el tercer trimestre","Abre y cierra los ojos y percibe cambios de luz. Se acumula grasa bajo la piel y los pulmones podrían funcionar con apoyo si naciera. Si la persona gestante es Rh negativa, alrededor de esta semana se indica inmunoglobulina anti-D.","≈ 37 cm · 1 kg"],
["Huesos más fuertes","El esqueleto absorbe calcio con rapidez, por eso son importantes el calcio y el hierro en la alimentación. El feto patea, rueda y puede tener hipo. Conviene prestar atención a sus movimientos diarios.","≈ 38 cm · 1,15 kg"],
["Mielinización","Comienza la mielinización de los nervios, que acelera la transmisión de señales. La médula ósea pasa a ser la principal productora de glóbulos rojos y el lanugo empieza a caer.","≈ 40 cm · 1,3 kg"],
["Todos los sentidos funcionan","La pupila responde a la luz y todos los sentidos funcionan. El feto crece sobre todo en peso y suele ubicarse con la cabeza hacia abajo.","≈ 41 cm · 1,5 kg"],
["Uñas y cabello","Las uñas llegan a la punta de los dedos y puede verse cabello. Sigue acumulando la grasa que lo abrigará al nacer. Se controla el crecimiento y la posición fetal con ecografía.","≈ 42 cm · 1,7 kg"],
["Cabeza hacia abajo","Los huesos del cráneo permanecen blandos y sin fusionar para poder atravesar el canal de parto. Los pulmones siguen madurando.","≈ 44 cm · 1,9 kg"],
["Pulmones casi listos","El vérnix se engrosa y casi todo el lanugo ya cayó. Los sistemas nervioso y respiratorio continúan madurando. Se consideran prematuros tardíos los nacimientos entre las semanas 34 y 36+6.","≈ 45 cm · 2,1 kg"],
["Riñones completos","Los riñones están desarrollados y el hígado procesa desechos. Entre las semanas 35 y 37 se toma el cultivo vaginal y rectal para estreptococo del grupo B, que orienta los cuidados durante el parto.","≈ 46 cm · 2,4 kg"],
["Se encaja en la pelvis","El feto suele encajarse en la pelvis, lo que puede aliviar la presión en el diafragma y aumentarla en la zona pélvica. Practica succión y deglución. Los controles pasan a ser más frecuentes.","≈ 47 cm · 2,6 kg"],
["Término temprano","De la semana 37 a la 38+6 se llama término temprano. Los pulmones están casi maduros y practica movimientos respiratorios. Se revisa la presentación y se conversa el plan de parto.","≈ 48 cm · 2,9 kg"],
["Cerebro y pulmones maduran","El cerebro y los pulmones siguen madurando hasta el nacimiento. El meconio se acumula en el intestino, listo para la primera deposición después de nacer.","≈ 49 cm · 3,1 kg"],
["Término completo","Entre las semanas 39 y 40+6 se llama término completo. El feto sigue ganando peso. Señales de inicio de trabajo de parto: contracciones regulares, pérdida del tapón mucoso o rotura de bolsa.","≈ 50 cm · 3,3 kg"],
["Fecha probable de parto","La mayoría de los partos ocurre entre las semanas 38 y 41; la fecha probable es una estimación y solo una minoría nace ese día. Consultá enseguida si disminuyen los movimientos, hay sangrado, pérdida de líquido o contracciones regulares.","≈ 51 cm · 3,4 kg"],
["Pasada la fecha","Entre las semanas 41 y 42 el equipo suele controlar la vitalidad fetal y planificar la inducción si el trabajo de parto no comenzó.","≈ 52 cm · 3,6 kg"],
["Semana 42","A partir de las 42 semanas el embarazo se considera postérmino: se recomienda conducta activa y no esperar más.","≈ 52 cm · 3,7 kg"]
];

  else if(a==="scr"){var k=today(),v=Math.max(0,(+S.screen[k]||0)+(+t.getAttribute("data-d")));S.screen[k]=v;save();render(true)}
  else if(a==="addq"){var q=CRIANZA[i].p;if(S.notes.indexOf(q)<0){S.notes.push(q);save();render(true)}}
  else if(a==="addn"){var el=document.getElementById("in-q"),v2=el.value.trim();if(v2){S.notes.push(v2);save();render(true)}}

});

function dayKey(ms){return today(new Date(ms))}
function dayLabel(k){var t=today(),y=today(new Date(Date.now()-864e5));if(k===t)return "Hoy";if(k===y)return "Ayer";var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}
function ago(ms){var m=Math.max(0,Math.round((Date.now()-ms)/6e4));if(m<60)return m+" min";var h=Math.floor(m/60);return h+" h"+(m%60?" "+(m%60)+" min":"")}
function localDT(ms){var d=new Date(ms);return today(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function durTxt(v){var h=Math.floor(v/60),m=v%60;return (h?h+" h ":"")+(m?m+" min":"")||"0 min"}
function tC(v){return Number(v).toFixed(1).replace(".",",")+" °C"}
function summ(e){
  if(e.k==="fiebre")return tC(e.v)+(e.n?" · "+e.n:"");
  if(e.k==="med")return e.n+(e.d?" · "+e.d:"")+(e.x?" ("+e.x+")":"");
  if(e.k==="comida"||e.k==="panal")return e.n+(e.d?" · "+e.d:"");
  if(e.k==="sueno")return "Durmió "+durTxt(e.v);
  return e.n||"";
}
function copyTxt(t,btn){
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");btn.textContent="Copiado"}catch(e){btn.textContent="No se pudo copiar"}a.remove()}
  try{navigator.clipboard.writeText(t).then(function(){btn.textContent="Copiado"},fb)}catch(e){fb()}
}
function shareTxt(t,title,btn){if(navigator.share){navigator.share({title:title,text:t}).catch(function(){})}else copyTxt(t,btn)}
function printTxt(t){
  var pa=document.getElementById("pa");if(!pa){pa=document.createElement("div");pa.id="pa";document.body.appendChild(pa)}
  pa.textContent=t;document.body.classList.add("pr");
  var done=function(){document.body.classList.remove("pr");window.removeEventListener("afterprint",done)};
  window.addEventListener("afterprint",done);setTimeout(done,60000);
  window.print();
}
function sheet(h){document.getElementById("shp").innerHTML=h;document.getElementById("sh").classList.add("on")}

/* registro */
function lastMeds(){
  var seen={},out=[],since=Date.now()-24*36e5;
  S.log.forEach(function(e){if(e.k==="med"&&e.t>=since&&e.t<=Date.now()+6e4){var key=(e.n||"").toLowerCase();if(!seen[key]){seen[key]=1;out.push(e)}}});
  return out;
}
function chartHTML(){
  var since=Date.now()-72*36e5,pts=S.log.filter(function(e){return e.k==="fiebre"&&e.t>=since}).sort(function(a,b){return a.t-b.t});
  if(pts.length<2)return "";
  var W=340,H=130,L=34,R=10,T=10,B=22,lo=36,hi=41;
  function x(t){return L+(t-since)/(72*36e5)*(W-L-R)}
  function y(v){v=Math.max(lo,Math.min(hi,v));return T+(hi-v)/(hi-lo)*(H-T-B)}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Temperaturas de las últimas 72 horas">';
  [36,37,38,39,40,41].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(v===38?"#D8373B":"#ECEAE3")+'" stroke-width="'+(v===38?1.5:1)+'" '+(v===38?'stroke-dasharray="4 4"':"")+'/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="#6F6B5F">'+v+'</text>'});
  var d="";pts.forEach(function(p,i){d+=(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)+" "});
  s+='<path d="'+d+'" fill="none" stroke="#16140F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p){s+='<circle cx="'+x(p.t).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="5" fill="'+(p.v>=38?"#D8373B":"#F0AB0C")+'" stroke="#16140F" stroke-width="2"/>'});
  s+='<text x="'+L+'" y="'+(H-6)+'" font-size="10" fill="#6F6B5F">hace 72 h</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" fill="#6F6B5F">ahora</text></svg>';
  return '<div class="card"><p class="eyebrow">Temperatura · últimas 72 horas</p>'+s+'</div>';
}
function vRegDia(){

  Object.keys(KINDS).forEach(function(k){var K=KINDS[k];h+='<button data-a="addlog" data-k="'+k+'"><span class="ic '+K[2]+'">'+svg(K[3])+'</span>'+(k==="fiebre"?"Fiebre":K[0])+'</button>'});
  h+='</div>';
  var m=months(),lf=null;
  S.log.forEach(function(e){if(!lf&&e.k==="fiebre"&&e.t>=Date.now()-24*36e5)lf=e});
  if(lf&&m!=null&&m<3&&lf.v>=38)h+='<div class="banner red">Bebé menor de 3 meses con 38 °C o más: es una urgencia. No esperes.</div><div style="margin-bottom:14px">'+emergBtn()+'</div>';
  lastMeds().forEach(function(e){h+='<div class="medb"><span class="ic b">'+svg("pill")+'</span><span><b>'+esc(e.n)+': última dosis hace '+ago(e.t)+'</b><span class="mut sm">a las '+hhmm(e.t)+(e.d?" · "+esc(e.d):"")+'. Seguí siempre la indicación de tu pediatra.</span></span></div>'});
  h+=chartHTML();

  [["todo","Todo"],["fiebre","Fiebre"],["med","Medicación"],["comida","Comidas"],["panal","Pañales"],["sueno","Sueño"],["nota","Notas"]].forEach(function(f){h+='<button class="chip'+(logF===f[0]?" on":"")+'" data-a="logf" data-f="'+f[0]+'">'+f[1]+'</button>'});

  if(!es.length)h+='<div class="card flat" style="margin-top:12px"><p class="mut">Todavía no hay registros. Tocá un botón de arriba para empezar.</p></div>';

    h+='<div class="ev"><span class="dot" style="background:'+KINDS[e.k][1]+'"></span><span class="tm">'+hhmm(e.t)+'</span><span class="tx"><b>'+esc(KINDS[e.k][0])+'</b><small>'+esc(summ(e))+'</small></span><button data-a="dellog" data-id="'+e.id+'" aria-label="Borrar registro">×</button></div>';
  });
  h+='<div style="margin-top:22px"><button class="btn dark" data-a="resumen">Resumen para la consulta</button></div>';
  h+='<p class="fine">Estos registros son tuyos y se guardan solo en este dispositivo. No reemplazan las indicaciones de tu pediatra.</p>';

function saveLog(k){
  var g=function(id){var e=document.getElementById(id);return e?e.value.trim():""};
  var t=new Date(g("l-t")).getTime();if(!t||isNaN(t))t=Date.now();
  var e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),k:k,t:t},err="";
  if(k==="fiebre"){e.v=parseFloat(g("l-v").replace(",","."));e.n=g("l-n");if(!(e.v>=34&&e.v<=43))err="Ingresá una temperatura entre 34 y 43 °C."}
  if(k==="med"){e.n=g("l-n");e.d=g("l-d");e.x=g("l-x");if(!e.n)err="Escribí el nombre del medicamento."}
  if(k==="comida"||k==="panal"){e.n=g("l-n");e.d=g("l-d")}
  if(k==="sueno"){e.v=parseInt(g("l-v"),10);if(!(e.v>0))err="Ingresá la duración en minutos."}
  if(k==="nota"){e.n=g("l-n");if(!e.n)err="Escribí la nota."}
  if(err){var b=document.getElementById("l-e");b.textContent=err;b.style.display="block";return}
  S.log.push(e);S.log.sort(function(a,b){return b.t-a.t});save();closeSheet();render(true);
}

  var f=S.ficha||{},m=months(),L=["RESUMEN PARA LA CONSULTA","Generado: "+new Date().toLocaleString("es-AR"),"","Nombre: "+(S.name||"—")];
  if(m!=null)L.push("Edad: "+ageLabel(m));
  L.push("Alergias: "+(f.alergias||"no registradas"),"Medicación habitual: "+(f.meds||"no registrada"),"Condiciones de salud: "+(f.cond||"no registradas"),"","Últimos 7 días:");
  var es=S.log.filter(function(e){return e.t>=Date.now()-7*864e5}).sort(function(a,b){return a.t-b.t});

  h+='<h3>Qué es y qué no es</h3><p class="sm">Child es una guía general. No diagnostica, no indica tratamientos ni reemplaza la consulta con un profesional. Las ilustraciones del embarazo son esquemáticas.</p>';
  h+='<h3>Novedades de la 0.20</h3><ul class="sm"><li>Registro: nueva pestaña «Cartas» para escribirle cartas al niño (o al bebé que viene), con fecha y título. Se guardan en el teléfono, se pueden editar, copiar y compartir. Es solo texto tuyo, sin contenido clínico.</li></ul><h3>De la 0.19</h3><ul class="sm"><li>Plan de parto: ahora tiene una lista de «Preguntas para mi equipo» que armás vos (agregar, tildar cuando te respondieron, quitar). Se copia junto con el plan. La app no sugiere preguntas.</li></ul><h3>Novedades de la 0.18</h3><ul class="sm"><li>Crecimiento: las curvas ahora siguen después de los 5 años, hasta los 19, con la referencia de crecimiento de la OMS 2007 (tablas oficiales). Talla e IMC de 5 a 19 años; peso de 5 a 10 años, que es hasta donde lo publica la OMS. El resumen para la consulta también muestra el percentil a esas edades. Esta parte está en borrador, con revisión médica pendiente.</li></ul><h3>De la 0.17</h3><ul class="sm"><li>Registro, pestaña Quien cuida: una hoja para dejarle a la abuela, la niñera o quien se quede. Junta lo que ya cargaste (a quién le toca hoy, alergias, medicación habitual y condiciones de la ficha, teléfonos para llamar con un toque y la rutina del día) y suma tus propias indicaciones. Podés copiarla o compartirla. Solo muestra lo que escribiste vos: no agrega consejos ni interpreta nada.</li></ul><h3>De la 0.16</h3><ul class="sm"><li>Registro, pestaña Rutina: armá la rutina del día con tus propios pasos, separados en mañana, tarde y noche, y tildalos a medida que se hacen. Cada día arranca sin tildes. Podés copiar la rutina. Es una guía tuya: no pone horarios ni edades esperadas y no avisa sola.</li></ul><h3>De la 0.15</h3><ul class="sm"><li>Registro, pestaña Turnos: anotá quién cuida cada día de la semana (por ejemplo mamá, papá, abuela, niñera). Muestra a quién le toca hoy y podés copiar la semana para mandarla. Es una agenda tuya: no avisa sola ni se comparte en tiempo real.</li></ul><h3>De la 0.14</h3><ul class="sm"><li>El resumen para la consulta ahora incluye, si los hay, los momentos que anotaste en el Álbum en los últimos 30 días (fecha, título, edad y tu nota). Es solo lo que escribiste vos; no interpreta nada.</li></ul><h3>De la 0.13</h3><ul class="sm"><li>Registro, pestaña Hogar: dos listas simples para la familia, Compras y Tareas. Tildás lo hecho, agregás lo tuyo (en Tareas, con quién se encarga), quitás lo ya hecho de una vez y copiás la lista para mandarla por WhatsApp. Sin contenido clínico; no sugiere nada.</li></ul><h3>De la 0.12</h3><ul class="sm"><li>Registro, pestaña Gastos: anotá lo que gastás en salud (consultas, estudios, medicamentos, vacunas y otros) con fecha y nota. Muestra el total del mes y el total general, y podés copiar la lista. Es solo una cuenta tuya; no tiene contenido clínico.</li></ul><h3>De la 0.11</h3><ul class="sm"><li>Guía: se cargaron los capítulos 1 (gestación, recién nacido y 0 a 2 años), 2 (2 a 12 años) y 3 (adolescencia) entregados por el autor. Revisión médica: pendiente.</li></ul><h3>De la 0.10</h3><ul class="sm"><li>Embarazo, pestaña Herramientas: contador de movimientos, registro de síntomas, peso y presión, contador de contracciones y plan de parto. La app solo registra; no interpreta los valores.</li><li>Registro, pestaña Lactancia: cronómetro de tomas de pecho, con el lado, que queda en el registro del día.</li></ul><h3>De la 0.9</h3><ul class="sm"><li>Nueva barra: Inicio, Desarrollo, Crianza, Historial y Preguntas. Se quitaron el botón SOS y la sección Alertas.</li><li>Desarrollo: embarazo semana a semana, hitos hasta los 5 años y etapas escolar y adolescencia (borrador).</li><li>Crianza: recomendaciones según la edad cargada en Inicio (borrador).</li><li>Historial médico: cargá y pegá la información de salud, también desde un archivo de texto.</li><li>Preguntas: escribí una consulta y mandásela a quien te responde.</li></ul><h3>De la 0.8</h3><ul class="sm"><li>Agenda en Registro: citas y controles con fecha, hora y lugar; podés bajarlas al calendario del celular.</li><li>Pañales en el registro diario.</li><li>Bolso de maternidad en Embarazo: lista propia para tildar, con ideas generales para empezar (borrador, sin revisión médica).</li><li>Álbum de primeras veces en Registro: anotá la fecha y un recuerdo, con la edad que tenía ese día. Se guarda solo en este dispositivo y entra en la copia de seguridad.</li></ul><h3>De la 0.7</h3><ul class="sm"><li>Borradores de los capítulos 6, 7, 8, 9, 10, 12, 14 y 21, marcados para revisión.</li><li>Próximo control en Inicio, según la edad.</li><li>Algoritmo de tamizaje del desarrollo.</li></ul>';
  h+='<h3>Próximo</h3><ul class="sm"><li>Contenido clínico completo de cada capítulo, entrega por entrega.</li><li>Calendario de vacunación por país.</li><li>Ilustraciones médicas propias.</li></ul>';

function erf(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+.3275911*x),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y}

function grOk(ind,day){

function grSpan(){

  }
  var a=LMS[ind][sx],lo=0,hi=a.length-1;
  if(day<=a[0][0])return a[0].slice(1);
  if(day>=a[hi][0])return a[hi].slice(1);
  while(hi-lo>1){var mid=(lo+hi)>>1;if(a[mid][0]<=day)lo=mid;else hi=mid}
  var A=a[lo],B=a[hi],t=(day-A[0])/(B[0]-A[0]);

/* calculadora de fecha probable */
function isoOf(ms){return new Date(ms).toISOString().slice(0,10)}
function redatThr(d){return d<=62?5:d<=97?7:d<=111?7:d<=153?10:d<=195?14:21}
function wd(d){return Math.floor(d/7)+"+"+(d%7)}
function fdCalc(){
  var o={},cyc=parseInt(FD.cycle,10);
  if(!(cyc>=21&&cyc<=45))cyc=28;
  var off=cyc-28;
  if(FD.fum){o.fumMs=utc(FD.fum);o.fppFum=o.fumMs+(280+off)*864e5;o.gaToday=Math.round((nowUtc()-o.fumMs)/864e5)-off}
  if(FD.usd){
    var g=null;
    if(FD.mode==="crl"){var c=parseFloat(String(FD.crl).replace(",","."));if(c>=5&&c<=84)g=Math.round(8.052*Math.sqrt(c)+23.73);else if(FD.crl!=="")o.err="La longitud cráneo-caudal debe estar entre 5 y 84 mm."}
    else if(FD.w!==""){var w=parseInt(FD.w,10),d=parseInt(FD.d||"0",10);if(w>=5&&w<=42&&d>=0&&d<=6)g=w*7+d;else o.err="Ingresá semanas entre 5 y 42, y días entre 0 y 6."}
    if(g!==null){o.gaUs=g;o.usMs=utc(FD.usd);o.fppUs=o.usMs+(280-g)*864e5;o.gaUsToday=Math.round((nowUtc()-o.usMs)/864e5)+g}
  }
  if(o.fumMs!==undefined&&o.gaUs!==undefined){
    o.fumAtUs=Math.round((o.usMs-o.fumMs)/864e5)-off;o.diff=Math.abs(o.fumAtUs-o.gaUs);o.thr=redatThr(o.gaUs);
    o.useUs=FD.unsure||o.diff>o.thr;
  }
  o.chosen=o.useUs?o.fppUs:(o.fppFum!==undefined?o.fppFum:o.fppUs);
  return o;
}
function fdOut(){
  var o=fdCalc(),h="";
  if(o.err)h+='<div class="banner red">'+esc(o.err)+'</div>';
  if(o.fppFum===undefined&&o.fppUs===undefined)return h+'<div class="card flat"><p class="mut">Ingresá la FUM o los datos de la ecografía para calcular.</p></div>';
  h+='<div class="cmp">';
  if(o.fppFum!==undefined)h+='<div class="card" style="padding:16px"><p class="eyebrow">Por FUM</p><div class="fdbig">'+esc(fmtDate(o.fppFum))+'</div><p class="sm mut">'+(o.gaToday>=0?"Hoy: semana "+wd(o.gaToday):"")+'</p></div>';
  if(o.fppUs!==undefined)h+='<div class="card" style="padding:16px"><p class="eyebrow">Por ecografía</p><div class="fdbig">'+esc(fmtDate(o.fppUs))+'</div><p class="sm mut">Hoy: semana '+wd(Math.max(0,o.gaUsToday))+'</p></div>';
  h+='</div>';
  if(o.diff!==undefined){
    if(FD.unsure)h+='<div class="banner amb">Como no estás segura de la FUM, se usa la fecha de la ecografía.</div>';
    else if(o.useUs)h+='<div class="banner amb">La diferencia es de '+o.diff+(o.diff===1?" día":" días")+' y supera el umbral de '+o.thr+' días para esa edad gestacional. Se recomienda usar la fecha de la ecografía.</div>';
    else h+='<div class="banner ok">La diferencia es de '+o.diff+(o.diff===1?" día":" días")+', dentro del umbral de '+o.thr+' días. Se mantiene la fecha por FUM.</div>';
  }
  h+='<div class="card flat"><p class="eyebrow">Fecha recomendada</p><div class="fdbig">'+esc(fmtDate(o.chosen))+'</div>';
  if(S.mode==="esp")h+='<div style="margin-top:12px"><button class="btn" data-a="usefum">Usar esta fecha en la app</button></div>';
  h+='<p class="fine" style="margin-top:12px">La fecha definitiva la confirma tu obstetra. Criterios de redatación de ACOG (opinión de comité 700); datación por CRL con la fórmula de Robinson. Pendiente de revisión médica.</p></div>';

}

/* lactancia */

setInterval(function(){
  var a=document.getElementById("ct-t");if(a&&contT0)a.textContent=fmtMS((Date.now()-contT0)/1000);
  var b=document.getElementById("lc-t");if(b&&lacT0)b.textContent=fmtMS((Date.now()-lacT0)/1000);
},1000);
document.addEventListener("click",function(ev){
  var t=ev.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute("data-a")))t=t.parentNode;
  if(!t||t===document)return;
  var a=t.getAttribute("data-a"),id=t.getAttribute("data-id"),v=t.getAttribute("data-v"),$=function(i){return document.getElementById(i)};
  ["mov","sint","pp","cont"].forEach(function(k){if(!S[k])S[k]=[]});if(!S.plan)S.plan={};
  if(a==="et"){embTool=v;render()}
  else if(a==="mvp"){if(!movT0)movT0=Date.now();movN++;$("mv-n").textContent=movN;$("mv-t").textContent="Desde las "+hhmm(movT0)}
  else if(a==="mvr"){movN=0;movT0=0;render(true)}
  else if(a==="mvs"){if(movN>0){S.mov.push({id:bagId(),t:movT0,n:movN,sec:(Date.now()-movT0)/1000});save();movN=0;movT0=0;render(true)}}
  else if(a==="mvd"){S.mov=S.mov.filter(function(e){return e.id!==id});save();render(true)}
  else if(a==="sit"){var k=SINT[+t.getAttribute("data-i")];sintSel[k]=!sintSel[k];t.classList.toggle("on")}
  else if(a==="sis"){
    var g=SINT.filter(function(x){return sintSel[x]}),n=$("si-n").value.trim();
    if(!g.length&&!n){var b=$("si-e");b.textContent="Elegí al menos un síntoma o escribí una nota.";b.style.display="block";return}
    S.sint.push({id:bagId(),t:Date.now(),g:g,n:n});sintSel={};save();render(true);
  }
  else if(a==="sid"){S.sint=S.sint.filter(function(e){return e.id!==id});save();render(true)}
  else if(a==="pps"){
    var n2=function(i){var x=$(i).value.trim().replace(",",".");return x===""?null:parseFloat(x)},w=n2("pp-w"),si=n2("pp-s"),di=n2("pp-i"),er="";
    if(w===null&&si===null&&di===null)er="Ingresá al menos un dato.";
    else if(w!==null&&!(w>=30&&w<=250))er="El peso debe estar entre 30 y 250 kg.";
    else if((si===null)!==(di===null))er="Cargá las dos cifras de la presión.";
    else if(si!==null&&!(si>=50&&si<=260&&di>=30&&di<=160))er="Revisá las cifras de presión.";
    if(er){var b3=$("pp-e");b3.textContent=er;b3.style.display="block";return}
    S.pp.push({id:bagId(),d:$("pp-d").value||today(),w:w,s:si,i:di});save();render(true);
  }
  else if(a==="ppd"){S.pp=S.pp.filter(function(e){return e.id!==id});save();render(true)}
  else if(a==="ctt"){
    if(!contT0){contT0=Date.now();render(true)}
    else{S.cont.push({id:bagId(),s:contT0,e:Date.now()});contT0=0;save();render(true)}
  }
  else if(a==="ctr"){if(confirm("¿Borrar todo el registro de contracciones?")){S.cont=[];save();render(true)}}
  else if(a==="plqa"||a==="plqt"||a==="plqd"){
    PLAN_Q.forEach(function(q){var e=$("pl-"+q[0]);if(e)S.plan[q[0]]=e.value.trim()});
    if(!S.plan.qs)S.plan.qs=[];
    if(a==="plqa"){var i=$("pl-qn"),v=i?i.value.trim():"";if(v)S.plan.qs.push({id:bagId(),t:v,ok:false})}
    else if(a==="plqt"){S.plan.qs.forEach(function(x){if(x.id===id)x.ok=!x.ok})}
    else S.plan.qs=S.plan.qs.filter(function(x){return x.id!==id});
    save();render(true)}
  else if(a==="pls"||a==="plc"){PLAN_Q.forEach(function(q){var e=$("pl-"+q[0]);if(e)S.plan[q[0]]=e.value.trim()});save();if(a==="plc")copyTxt(planText(),t);else{t.textContent="Guardado"}}
  else if(a==="lcs"){lacSide=v;render(true)}
  else if(a==="lct"){
    if(!lacT0){lacT0=Date.now();render(true)}
    else{var m=Math.max(1,Math.round((Date.now()-lacT0)/6e4));S.log.push({id:bagId(),k:"comida",t:lacT0,n:"Pecho",d:lacSide+" · "+m+" min"});S.log.sort(function(x,y){return y.t-x.t});lacT0=0;save();render(true)}
  }
});

function money(n){return "$ "+n.toLocaleString("es-AR",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}

document.addEventListener("click",function(ev){
  var t=ev.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute("data-a")))t=t.parentNode;

  if(L.length){h+='<div class="row" style="margin-top:10px;gap:8px">';if(ok)h+='<button class="chip" data-a="hogdone">Quitar los hechos</button>';h+='<button class="chip" data-a="hogcp">Copiar la lista</button></div>'}
  return h;
}

document.addEventListener("click",function(ev){

  }

  else if(a==="hogcp"){copyTxt(hogText(),t)}
});

var DOCS=[{"n":1,"t":"Gestación, recién nacido y 0 a 2 años","s":"Cap. 1 del libro · entrega del autor","b":[{"p":"Este es el primer capítulo desarrollado del índice general. Cubre desde el cálculo de la edad gestacional por Fecha de Última Menstruación (FUM) hasta los 2 años de vida. Los siguientes capítulos (preescolar, escolar, adolescencia, enfermedades prevalentes y síndromes) se entregarán como documentos independientes."},{"h":"1. Cálculo de la edad gestacional y fecha probable de parto (FUM)"},{"ul":["La Regla de Naegele estima la fecha probable de parto: FUM + 7 días − 3 meses (o + 9 meses), asumiendo ciclos de 28 días.","La edad gestacional se cuenta en semanas desde el primer día de la FUM, no desde la concepción.","El embarazo se organiza en tres trimestres: 1º (semanas 1-13), 2º (semanas 14-27), 3º (semanas 28-40/42).","Si los ciclos son irregulares o la FUM es incierta, la ecografía del primer trimestre (idealmente entre semanas 8-13) es más precisa para fechar el embarazo que la FUM."]},{"h":"2. Calendario de controles prenatales"},{"p":"El esquema tradicional incluye visitas cada 4 semanas hasta las 28 semanas, cada 2-3 semanas hasta las 36 semanas, y semanalmente hasta el parto (Sara R Till et al., Cochrane Database of Systematic Reviews). Las guías actuales permiten esquemas individualizados (6-10 visitas en embarazos de bajo riesgo), siempre que se mantengan los servicios clave en los puntos de contacto esenciales (Committee on Clinical Consensus—Obstetrics, ACOG)."},{"p":"En cada visita se evalúa de forma sistemática: presión arterial, peso materno, altura uterina (desde las 24 semanas), y presencia de movimientos/latido fetal según la edad gestacional (Blosser et al., Department of Veterans Affairs)."},{"p":"El siguiente cronograma resume qué estudios corresponden a cada etapa del embarazo:"},{"call":"info","t":"Figura pendiente","x":"FIG. 1 [19]: cronograma de estudios por etapa del embarazo. Todavía no está cargada en la app."},{"p":"Hitos clave por trimestre:"},{"ul":["**Primer trimestre:** confirmación del embarazo, historia clínica completa, laboratorios basales (grupo sanguíneo, hemograma, serologías), ecografía de datación, tamizaje de cromosomopatías (semana 11-14).","**Segundo trimestre:** ecografía morfológica (18-22 semanas), tamizaje de diabetes gestacional (24-28 semanas), vacuna Tdap (a partir de semana 27) y vacuna RSV materna cuando corresponda.","**Tercer trimestre:** cultivo para Streptococcus del grupo B (35-37 semanas), monitorización de crecimiento fetal, preparación para el parto y lactancia."]},{"p":"No se recomienda de rutina la medición de proteína en orina por tira reactiva ni el conteo rutinario de movimientos fetales como predictor único de mortinatos, salvo condiciones de riesgo específicas (Committee on Clinical Consensus—Obstetrics)."},{"h":"3. El recién nacido: primeros días"},{"ul":["**Tamizaje neonatal:** pruebas metabólicas/genéticas, tamizaje auditivo y evaluación clínica antes del alta.","**Alta hospitalaria:** estancia suficiente para identificar problemas tempranos; visita de seguimiento óptima entre las 48-72 horas post-alta.","**Lactancia:** apoyo activo para iniciar, mantener la exclusividad y prolongar la duración de la lactancia materna (Hudak ML et al., AAP)."]},{"h":"4. Controles de niño sano: periodicidad"},{"p":"El esquema de visitas de supervisión pediátrica (Bright Futures/AAP) recomienda controles en: recién nacido, 3-5 días, 1 mes, 2, 4, 6, 9, 12, 15, 18, 24 y 30 meses, y luego anualmente (2017 Recommendations for Preventive Pediatric Health Care, Pediatrics). Cada visita incluye historia, examen físico completo, revisión de crecimiento, actualización de vacunas y guía anticipatoria (Turner K, American Family Physician)."},{"h":"5. Hitos del desarrollo (0-2 años)"},{"p":"La vigilancia del desarrollo debe realizarse en cada visita, con tamizaje formal a los 9, 18 y 30 meses, y tamizaje específico de autismo a los 18 y 24 meses (Turner K; Zubler JM et al., Pediatrics)."},{"table":{"head":["Edad","Motor grueso","Motor fino","Lenguaje","Social/cognitivo","Referencias"],"rows":[["2 meses","Levanta la cabeza en prono","Sigue objetos con la mirada","Vocaliza, arrulla","Sonrisa social","[12]"],["6 meses","Se sienta con apoyo","Transfiere objetos entre manos","Balbucea","Reconoce caras familiares","[12]"],["9 meses","Gatea, se para con apoyo","Pinza inferior","Dice \"mamá/papá\" sin intención","Juega a esconder objetos","[12][9]"],["12 meses","Camina con apoyo o solo","Pinza fina","Primera palabra con significado","Señala para pedir","[12]"],["18 meses","Camina bien, sube escalones con ayuda","Garabatea","10-25 palabras","Juego simbólico simple","[12][9]"],["24 meses","Corre, patea pelota","Torre de 6 cubos","Frases de 2 palabras","Juego paralelo","[12][9]"]]}},{"p":"**Alertas de desarrollo (bandera roja) que requieren evaluación sin esperar:** ausencia de sonrisa social a los 3 meses, hipotonía marcada, ausencia de balbuceo a los 9 meses, ausencia de palabras con significado a los 16 meses, ausencia de frases de 2 palabras a los 24 meses, pérdida de habilidades previamente adquiridas (regresión) a cualquier edad, o falta de contacto visual/respuesta al nombre (criterios de tamizaje de autismo)."},{"h":"6. Vacunación: nacimiento a 2 años"},{"p":"El calendario ACIP/CDC/AAP vigente establece el siguiente esquema combinado:"},{"call":"info","t":"Nota de la app","x":"Este es el esquema de Estados Unidos (ACIP/CDC/AAP) citado por el autor. El Calendario Nacional de Vacunación de Argentina se cargará aparte, desde la fuente oficial."},{"table":{"head":["Vacuna","Nacimiento","1 mes","2 meses","4 meses","6 meses","12-15 meses","18 meses","19-23 meses","Referencias"],"rows":[["Hepatitis B","1ª dosis","2ª dosis","","","","3ª dosis","","","[17][13]"],["Rotavirus","","","1ª dosis","2ª dosis","(3ª si Rotateq)","","","","[17]"],["DTaP","","","1ª dosis","2ª dosis","3ª dosis","— (4ª a los 15-18m)","","","[16][17]"],["Hib","","","1ª dosis","2ª dosis","3ª dosis (según marca)","Refuerzo","","","[17]"],["Neumocócica (PCV15/20)","","","1ª dosis","2ª dosis","3ª dosis","4ª dosis","","","[13]"],["Polio (IPV)","","","1ª dosis","2ª dosis","","3ª dosis","","","[13]"],["MMR","","","","","","1ª dosis","","","[13][16]"],["Varicela","","","","","","","1ª dosis","","[13]"],["Hepatitis A","","","","","","Serie de 2 dosis (12-23 meses)","","","[13]"],["Influenza","","","","","Anual desde 6 meses","","","","[13]"],["RSV (nirsevimab, anticuerpo monoclonal)","Dosis única estacional en lactantes elegibles","","","","","","","","[1][18]"]]}},{"p":"Nota: nirsevimab (Beyfortus) está aprobado para la prevención de enfermedad respiratoria baja por virus respiratorio sincitial (VRS) en neonatos y lactantes que cursan su primera temporada de VRS, y en niños hasta 24 meses que permanecen vulnerables para su segunda temporada [1]."},{"h":"7. Guía anticipatoria 0-2 años"},{"ul":["**Sueño seguro:** posición boca arriba, superficie firme, sin objetos sueltos en la cuna, hasta el primer año, para reducir el riesgo de síndrome de muerte súbita del lactante.","**Alimentación:** lactancia materna exclusiva idealmente hasta los 6 meses; introducción de sólidos a partir de los 6 meses; evitar jugo y bebidas azucaradas antes del año [9].","**Seguridad en el automóvil:** silla orientada hacia atrás hasta los 2 años o hasta el límite de peso/talla del asiento [9].","**Pantallas:** evitar por completo antes de los 18 meses (excepto videollamadas); limitar a 1 hora/día entre 2-5 años [9].","**Salud dental:** inicio de cepillado con la erupción del primer diente, uso de flúor según indicación.","**Prevención de caídas e intoxicaciones:** a medida que el niño gana movilidad (gateo, bipedestación), asegurar el hogar."]},{"p":"Documento parte de una serie. Próximas entregas: Parte II (Preescolar y Escolar, 2-12 años), Parte III (Adolescencia, 12-18 años), Parte IV (Enfermedades prevalentes por edad), Parte V (Síndromes y condiciones frecuentes)."}]},{"n":2,"t":"Preescolar y escolar: 2 a 12 años","s":"Cap. 2 del libro · entrega del autor","b":[{"p":"Este es el segundo capítulo de la guía pediátrica integral. Cubre desde los 2 hasta los 12 años (etapa preescolar y escolar). Continúa del Capítulo 1 (gestación y 0-2 años) ya entregado."},{"h":"1. Controles de niño sano (2-12 años)"},{"p":"Según el esquema de supervisión pediátrica de Bright Futures/AAP, después de los 2 años los controles se espacian a: 30 meses, 3, 4, 5, 6, 7, 8, 9, 10, 11 y 12 años (control anual). Cada visita incluye antropometría con percentiles de peso/talla/IMC, examen físico, actualización de vacunas, tamizaje de desarrollo y conducta, agudeza visual y auditiva, presión arterial a partir de los 3 años, y guía anticipatoria adaptada a la edad."},{"h":"2. Hitos del desarrollo por dominio (2-12 años)"},{"p":"Los hitos se agrupan en cuatro dominios: motor, lenguaje/comunicación, cognitivo y socioemocional. Desde 2022, el listado de hitos del CDC/AAP se basa en el umbral de que el 75% de los niños alcanza el hito a determinada edad (no el percentil 50), para evitar retrasos en la detección de alteraciones del desarrollo."},{"ul":["**2-3 años:** corre, sube escaleras alternando pies; combina 2-3 palabras en frases; sigue instrucciones de 2 pasos; juego simbólico; control de esfínteres iniciando.","**3-4 años:** pedalea un triciclo; habla en oraciones de 3-4 palabras entendibles por extraños; cuenta hasta 3-4 objetos; juega cooperativamente con otros niños.","**4-5 años:** salta en un pie, dibuja una persona con ≥3 partes; cuenta una historia simple; conoce colores y números básicos; muestra independencia en vestirse/comer.","**6-8 años (escolar inicial):** coordinación motora fina para escritura; lectura y aritmética básicas; relaciones de amistad estables; comprende reglas y normas.","**9-12 años:** pensamiento más abstracto; mayor autonomía; consolidación de habilidades académicas; inicio de cambios puberales tempranos en algunas niñas."]},{"p":"La vigilancia del desarrollo debe realizarse en cada control, combinando la historia dirigida, la observación directa y la preocupación de los padres; los cuestionarios estandarizados (ASQ-3, PEDS-DM) complementan pero no sustituyen el juicio clínico [2][5][8][11]. Existen diferencias normales entre sexos en el ritmo de adquisición de hitos, especialmente en lenguaje y socioemocional después del primer año, donde las niñas tienden a alcanzarlos algo antes que los varones [19]."},{"call":"info","t":"Figura pendiente","x":"FIGURE 2 [19]. Todavía no está cargada en la app."},{"h":"3. Calendario de vacunación (2-12 años)"},{"p":"Según el esquema ACIP vigente, en esta etapa deben completarse o administrarse:"},{"ul":["**Refuerzos de la serie primaria** (si no completados): DTaP (4ª y 5ª dosis, la 5ª entre 4-6 años), poliovirus (dosis final entre 4-6 años), triple viral (SRP) 2ª dosis a los 4-6 años, varicela 2ª dosis a los 4-6 años.","**Influenza:** una dosis anual antes de cada temporada; niños menores de 9 años que reciben la vacuna por primera vez requieren 2 dosis separadas por un mes.","**COVID-19:** según recomendación vigente de temporada.","**A los 11-12 años** inicia la serie de la adolescencia: Tdap, VPH (2 dosis) y meningocócica ACWY (1ª dosis), que se detallarán en el capítulo de adolescencia [3][6][9][12][14][16][17][18]."]},{"call":"info","t":"Nota de la app","x":"Es el esquema de Estados Unidos (ACIP). El Calendario Nacional de Vacunación de Argentina se cargará aparte, desde la fuente oficial."},{"p":"No se recomienda crear esquemas de vacunación personalizados fuera de lo aprobado por ACIP/AAP/AAFP, ya que podría no ofrecer protección adecuada [14]."},{"h":"4. Enfermedades y condiciones más prevalentes en esta etapa"},{"p":"**Agudas / infecciosas**"},{"ul":["**Otitis media aguda y otitis media con efusión:** muy frecuentes en preescolares; la otitis media crónica o recurrente se asocia a mayor riesgo de retraso en lenguaje, aprendizaje y desarrollo si no se trata oportunamente [13].","**Infecciones respiratorias virales recurrentes**, especialmente al iniciar jardín/escuela."]},{"p":"**Crónicas respiratorias y alérgicas**"},{"ul":["**Asma:** afecta a cerca del 9-9.5% de los niños; primera causa de consulta a urgencias pediátricas; mayor prevalencia y peor control en población afroamericana e hispana, con más ausentismo escolar y repitencia de grado en casos no controlados [4][7][10][13].","**Alergias** (incluida rinitis alérgica): la condición física más prevalente reportada en niños de 6-11 años (~21%) [7][10]."]},{"p":"**Peso y metabolismo**"},{"ul":["**Obesidad:** afecta a cerca del 18-20% de niños y adolescentes en EE. UU., con tendencia creciente desde los años 70 y mayor impacto en comunidades de bajos recursos [4]."]},{"p":"**Neurodesarrollo y salud mental**"},{"ul":["**TDAH:** diagnóstico presente en 6-9% de escolares, con prevalencia que aumenta con la edad (de 5.4% a los 6-7 años a 11.7% a los 10-11 años) [4][7][10].","**Problemas de conducta:** reportados en ~8% de niños de 6-11 años [7][10].","**Ansiedad:** diagnosticada en ~6.5% de niños de 6-11 años, con tendencia creciente y aumento marcado en comparaciones poblacionales recientes (2023 vs. 2011-2012) [7][10][20].","**Trastorno del espectro autista:** diagnosticado en ~3% de niños de esta edad [7][10].","**Trastornos de aprendizaje y del habla/lenguaje:** presentes en 6-8% de escolares [7][10]."]},{"p":"El siguiente gráfico compara las tendencias temporales (2023 frente a 2011-2012) en la prevalencia de 15 condiciones crónicas infantiles, usando dos fuentes de datos independientes (encuestas parentales y registros clínicos), mostrando aumentos sostenidos en casi todas salvo el asma, que disminuyó:"},{"call":"info","t":"Figura pendiente","x":"Figure 4 [20]. Todavía no está cargada en la app."},{"h":"5. Hábitos y guía anticipatoria clave (2-12 años)"},{"ul":["**Sueño:** la mayoría de los escolares de 6-11 años duerme ≥9 horas/noche; menos horas se asocia a peor desempeño conductual y académico [7][10].","**Actividad física y pantallas:** más de un tercio de los niños de 6-11 años tiene ≥4 horas diarias de pantalla, mientras más de la mitad cumple ≥60 minutos diarios de actividad física; ambos extremos deben abordarse en cada control [7][10].","**Salud bucal:** control odontológico regular desde los 2-3 años; solo el 73% de los niños de 6-11 años tiene salud oral reportada como excelente/muy buena, lo que resalta un área de mejora [7][10].","**Preparación escolar (\"school readiness\"):** se recomienda evaluar en el control de los 4-5 años el desarrollo cognitivo, del lenguaje, motor y socioemocional, dado el impacto de condiciones de salud no controladas (otitis crónica, asma, anemia) sobre el rendimiento escolar [13]."]},{"h":"6. Señales de alarma para derivación"},{"ul":["Pérdida de hitos previamente adquiridos (regresión del desarrollo) a cualquier edad.","Ausencia de lenguaje combinado a los 2 años o lenguaje ininteligible para extraños a los 4 años.","Episodios recurrentes de otitis con sospecha de hipoacusia o retraso del lenguaje asociado.","Asma con despertares nocturnos frecuentes, uso de broncodilatador de rescate >2 veces/semana, o visitas a urgencias.","Dificultad sostenida de atención, impulsividad o problemas de conducta que interfieren con el funcionamiento escolar o social, sugestivos de TDAH y ameritando evaluación formal.","Ansiedad, tristeza persistente o cambios conductuales marcados que afecten la vida diaria.","Aumento de peso/IMC que cruza percentiles de forma acelerada."]}]},{"n":3,"t":"Adolescencia: 12 a 18 años","s":"Cap. 3 del libro · entrega del autor","b":[{"h":"1. Pubertad y desarrollo puberal normal"},{"p":"La pubertad normal ocurre entre los 8-13 años en niñas y 9-14 años en niños [1]. El sistema de clasificación de Tanner describe cinco estadios de maduración sexual, evaluando desarrollo mamario y vello púbico en niñas, y volumen testicular, genitales y vello púbico en niños [1][5]."},{"ul":["**En niñas**: el primer signo es el botón mamario (telarquia), seguido de vello púbico (pubarquia). La menarquia ocurre 2-3 años después del inicio puberal, habitualmente en estadio mamario 5. El pico de velocidad de crecimiento ocurre en el primer año tras el inicio puberal, antes de la menarquia [1].","**En niños**: el primer signo es el aumento del volumen testicular (≥4 mL), seguido de crecimiento peneano y vello púbico. La espermatogénesis inicia en Tanner 3. El pico de crecimiento ocurre 2 años después del inicio puberal (Tanner 3-4) [1].","**Alertas de pubertad precoz**: desarrollo antes de los 8 años en niñas o 9 años en niños amerita evaluación endocrinológica, descartando causas centrales (lesión intracraneal) o periféricas [5].","**Alerta de pubertad retrasada**: ausencia de desarrollo mamario a los 13 años en niñas, o de crecimiento testicular a los 14 años en niños, requiere evaluación."]},{"call":"info","t":"Figura pendiente","x":"Figura 2 [13]. Todavía no está cargada en la app."},{"h":"2. Calendario de vacunación adolescente (ACIP)"},{"p":"A los 11-12 años, de forma simultánea, se recomiendan de rutina tres vacunas: Tdap (tétanos-difteria-tos ferina acelular), MenACWY (meningocócica conjugada tetravalente) y la primera dosis de la serie de VPH (puede iniciarse desde los 9 años) [2][6][9][10][11][12]."},{"call":"info","t":"Nota de la app","x":"Es el esquema de Estados Unidos (ACIP). El Calendario Nacional de Vacunación de Argentina se cargará aparte, desde la fuente oficial."},{"ul":["**VPH**: esquema de 2 dosis si se inicia antes de los 15 años; 3 dosis si se inicia después [2].","**MenACWY**: dosis de refuerzo a los 16 años [9].","**MenB**: decisión clínica compartida para adolescentes sanos de 16-23 años, especialmente en brotes o condiciones de riesgo [10].","**Influenza**: anual, todos los adolescentes [2].","**COVID-19**: dosis anual actualizada recomendada para todos los adolescentes [2].","**Vacunación de puesta al día**: revisar en cada visita si faltan dosis de hepatitis B, hepatitis A, triple viral (SPR), poliomielitis o varicela [10]."]},{"p":"La cobertura de VPH sigue siendo menor que la de Tdap y MenACWY, con brechas persistentes en zonas rurales [12]. Cada visita pediátrica, incluidas las de control deportivo o enfermedad aguda, es una oportunidad para actualizar el esquema [10]."},{"h":"3. Salud mental y cribado de conductas de riesgo"},{"p":"Los trastornos mentales son la principal causa de carga de enfermedad en la adolescencia, afectando al 10-20% de los adolescentes en países de altos ingresos; el 65-70% de los problemas de salud mental de toda la vida comienzan antes de los 25 años [8]. Entre 2016 y 2022, ansiedad y depresión mostraron tendencias crecientes sostenidas en EE. UU., a diferencia de otras condiciones físicas que se mantuvieron estables o disminuyeron [14]."},{"ul":["**Herramientas de entrevista psicosocial**: HEEADSSS (hogar, educación/empleo, alimentación, actividades con pares, drogas, sexualidad, suicidio/depresión, seguridad) y SSHADESS (enfoque en fortalezas) son marcos recomendados para la entrevista integral del adolescente [3][7].","**Cribado de sustancias**: CRAFFT, S2BI (pregunta única sobre frecuencia de uso en el último año) y BSTAD son herramientas validadas y breves para pesquisar alcohol, tabaco y otras drogas desde los 9-11 años [3][7].","**Cribado de riesgo suicida y funcionalidad**: la pesquisa sistemática con herramientas validadas identifica a más adolescentes en riesgo que la sola impresión clínica, que ha demostrado fallar incluso en casos moderados a graves [7]."]},{"p":"A continuación se muestra la calculadora HEADS-ED, útil para la pesquisa rápida de salud mental y priorización de derivación en consulta o urgencias:"},{"call":"info","t":"Pendiente","x":"La calculadora HEADS-ED no llegó en el texto de la entrega y no está cargada en la app."},{"h":"4. Enfermedades y condiciones más prevalentes en la adolescencia"},{"ul":["**Depresión y ansiedad**: la depresión mayor es la principal causa de años de vida ajustados por discapacidad (DALYs) en ambos sexos de 15-19 años, con mayor proporción relativa en mujeres [4].","**Trastorno de conducta**: predomina en varones de 10-14 años en la mayoría de las regiones [4].","**Migraña**: relevante en niñas, especialmente en ciertas regiones [4].","**Acné vulgar**: condición no transmisible prevalente, con mayor carga relativa en varones de algunas regiones [4].","**Lumbalgia**: causa relevante de carga en varones adolescentes en Europa [4].","**Asma**: sigue siendo prevalente aunque con tendencia decreciente en años recientes [14].","**Consumo de alcohol y sustancias**: el inicio temprano se asocia con mayor riesgo de problemas futuros; la pesquisa debe iniciarse desde los 9-11 años [3].","**Obesidad, trastornos de la conducta alimentaria y escoliosis**: condiciones de alta prevalencia en esta etapa que requieren vigilancia activa en cada control de salud (no cubiertas en el detalle de las fuentes de esta entrega, se profundizarán en el capítulo temático correspondiente)."]},{"h":"5. Próximos pasos de la guía"},{"p":"Este capítulo se integrará con los capítulos temáticos de \"Enfermedades prevalentes\" y \"Síndromes y condiciones frecuentes\" del índice general, donde se profundizará en el manejo clínico específico de cada entidad (diagnóstico, tratamiento y seguimiento), así como en anticoncepción, salud sexual y reproductiva, y trastornos del neurodesarrollo persistentes en la adolescencia."}]}];
function docsCards(){

  DOCS.forEach(function(d,i){h+='<button class="pcard" data-a="gdoc" data-i="'+i+'"><span class="dm p-b"><span>'+d.n+'</span></span><span><span class="tt">'+esc(d.t)+'</span><small>'+esc(d.s)+'</small></span></button>'});
  return h;
}
function vDoc(i){
  var d=DOCS[i],h='<button class="back" data-a="dback">'+svg("back")+'Volver</button><div class="chead"><p class="eyebrow">Capítulo '+d.n+'</p><h1>'+esc(d.t)+'</h1><span class="st bor">Texto del autor · revisión médica pendiente</span></div>';
  h+=blocks(d.b);
  h+='<div class="card flat"><p class="sm">Las referencias entre corchetes, como [12], remiten a la bibliografía de la entrega del autor, que todavía no está cargada en la app.</p></div>';
  h+='<div class="cnav">'+(i>0?'<button class="btn ghost" data-a="gdoc" data-i="'+(i-1)+'">← Anterior</button>':'')+(i<DOCS.length-1?'<button class="btn ghost" data-a="gdoc" data-i="'+(i+1)+'">Siguiente →</button>':'')+'</div>';
  return h;
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute("data-a")))t=t.parentNode;
  if(!t||t===document)return;

/* ===== v0.15: turnos de cuidado ===== */
var TUR_D=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
function turHoy(){return (new Date().getDay()+6)%7}
function vTur(){
  var T=S.tur||{},hy=turHoy();
  var h='<p class="eyebrow">Turnos</p><h1 class="h1" style="margin-bottom:6px">Quién cuida cada día</h1><p class="mut" style="margin-bottom:14px">Anotá quién se queda con '+(S.name?esc(S.name):"el niño")+' cada día de la semana. Es una agenda tuya: no avisa sola ni se comparte en tiempo real; si querés pasarla, copiala.</p>';
  h+='<div class="card"><p class="mut sm" style="margin:0">Hoy, '+TUR_D[hy].toLowerCase()+'</p><p style="margin:2px 0 0;font-weight:700;font-size:18px;overflow-wrap:anywhere">'+(T[hy]?esc(T[hy]):"Sin anotar")+'</p></div>';
  TUR_D.forEach(function(d,i){h+='<label class="f" for="tu-'+i+'">'+d+(i===hy?" (hoy)":"")+'</label><input id="tu-'+i+'" type="text" maxlength="40" autocomplete="off" value="'+esc(T[i]||"")+'" placeholder="Ej.: Mamá, abuela">'});
  h+='<div class="row" style="margin-top:14px;gap:8px"><button class="btn" data-a="turs">Guardar</button><button class="chip" data-a="turc">Copiar la semana</button></div>';
  return h;
}
function turText(){var T=S.tur||{},o=["Turnos de cuidado"+(S.name?" · "+S.name:"")];TUR_D.forEach(function(d,i){o.push(d+": "+(T[i]||"-"))});return o.join("\n")}
document.addEventListener("click",function(ev){
  var t=ev.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute("data-a")))t=t.parentNode;
  if(!t||t===document)return;
  var a=t.getAttribute("data-a");
  if(a==="turs"||a==="turc"){
    var T={};TUR_D.forEach(function(d,i){var e=document.getElementById("tu-"+i);if(e&&e.value.trim())T[i]=e.value.trim()});
    S.tur=T;save();
    if(a==="turc")copyTxt(turText(),t);else render(true);
  }
});

/* ===== v0.16: rutina del dia ===== */
var RUT_M=[["m","Mañana"],["t","Tarde"],["n","Noche"]],rutM="m";
function vRut(){
  var L=(S.rut||[]),td=today(),h='<p class="eyebrow">Rutina</p><h1 class="h1" style="margin-bottom:6px">Rutina del día</h1><p class="mut" style="margin-bottom:14px">Armá los pasos de cada momento del día con tus propias palabras y tildalos cuando se hagan. Cada día empieza sin tildes. Es una guía tuya: no pone horarios ni edades esperadas, y no avisa sola.</p>';
  h+='<div class="chips fl" style="margin-bottom:12px">';
  RUT_M.forEach(function(m){h+='<button class="chip'+(rutM===m[0]?" on":"")+'" data-a="rutm" data-v="'+m[0]+'">'+m[1]+'</button>'});
  h+='</div>';
  var I=L.filter(function(x){return x.m===rutM}),ok=I.filter(function(x){return x.d===td}).length;
  if(I.length)h+='<p class="mut sm"><b>'+ok+' de '+I.length+'</b> hechos hoy</p>';
  h+='<div class="card">';
  if(!I.length)h+='<p class="mut">Todavía no hay pasos en este momento del día.</p>';
  I.forEach(function(x){var on=x.d===td;
    h+='<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><button class="chip'+(on?" on":"")+'" data-a="rutg" data-id="'+esc(x.id)+'" aria-label="Marcar" style="min-width:44px">'+(on?"✓":"")+'</button><span style="flex:1;overflow-wrap:anywhere;'+(on?"color:var(--mut);text-decoration:line-through":"")+'">'+esc(x.t)+'</span><button class="chip" data-a="rutr" data-id="'+esc(x.id)+'" aria-label="Quitar">Quitar</button></div>';
  });
  h+='</div><label class="f" for="ru-t">Agregar un paso</label><input id="ru-t" type="text" maxlength="60" autocomplete="off" placeholder="Ej.: Lavarse los dientes">';
  h+='<div class="row" style="margin-top:12px;gap:8px"><button class="btn" data-a="ruta">Agregar</button>'+(L.length?'<button class="chip" data-a="rutc">Copiar la rutina</button>':'')+'</div>';
  return h;
}
function rutText(){
  var o=["Rutina del día"+(S.name?" · "+S.name:"")],td=today();
  RUT_M.forEach(function(m){var I=(S.rut||[]).filter(function(x){return x.m===m[0]});if(I.length){o.push("",m[1]+":");I.forEach(function(x){o.push((x.d===td?"[x] ":"[ ] ")+x.t)})}});
  return o.join("\n");
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute("data-a")))t=t.parentNode;
  if(!t||t===document)return;
  var a=t.getAttribute("data-a"),id=t.getAttribute("data-id");
  if(a==="rutm"){rutM=t.getAttribute("data-v");render(true)}
  else if(a==="ruta"){var i=document.getElementById("ru-t"),v=i?i.value.trim():"";if(v){if(!S.rut)S.rut=[];S.rut.push({id:bagId(),m:rutM,t:v,d:""});save();render(true)}}
  else if(a==="rutg"){var td=today();(S.rut||[]).forEach(function(x){if(x.id===id)x.d=x.d===td?"":td});save();render(true)}
  else if(a==="rutr"){S.rut=(S.rut||[]).filter(function(x){return x.id!==id});save();render(true)}
  else if(a==="rutc"){copyTxt(rutText(),t)}
});

/* ===== v0.17: hoja para quien cuida (modo niñera) ===== */
function cuiTels(){
  var f=S.ficha||{},o=[];
  if(f.c1n||f.c1t)o.push([f.c1n||"Contacto 1",f.c1t||""]);
  if(f.c2n||f.c2t)o.push([f.c2n||"Contacto 2",f.c2t||""]);
  if(S.ped)o.push(["Pediatra",S.ped]);
  if(S.tox)o.push(["Toxicología",S.tox]);
  return o;
}
function vCui(){
  var f=S.ficha||{},m=months(),T=S.tur||{},hy=turHoy(),td=today(),nm=S.name?esc(S.name):"el niño";
  var h='<p class="eyebrow">Quien cuida</p><h1 class="h1" style="margin-bottom:6px">Hoja para quien cuida</h1><p class="mut" style="margin-bottom:14px">Todo lo que necesita saber quien se queda con '+nm+', en una sola pantalla. Junta lo que ya cargaste en la ficha, los turnos y la rutina, y suma tus indicaciones. Solo muestra lo que escribiste vos.</p>';
  h+='<div class="card"><p style="margin:0;font-weight:700;font-size:18px;overflow-wrap:anywhere">'+(S.name?esc(S.name):"Sin nombre cargado")+(m!=null?' <span class="mut" style="font-weight:400;font-size:15px">· '+esc(ageLabel(m))+'</span>':'')+'</p><p class="mut sm" style="margin:6px 0 0">Hoy, '+TUR_D[hy].toLowerCase()+', cuida: <b style="overflow-wrap:anywhere">'+(T[hy]?esc(T[hy]):"sin anotar")+'</b></p></div>';
  h+='<label class="f" for="cu-n">Indicaciones de la familia</label><textarea id="cu-n" rows="5" maxlength="1000" placeholder="Ej.: a qué hora volvemos, qué come, qué le gusta para dormirse, a quién se le puede abrir la puerta…">'+esc(S.cui||"")+'</textarea>';
  h+='<div style="margin-top:12px"><button class="btn" data-a="cuis">Guardar</button></div>';
  h+='<div class="card" style="margin-top:18px"><h2>Salud</h2><p class="mut sm" style="margin-bottom:8px">Lo que la familia cargó en la ficha de emergencia.</p><p class="sm" style="overflow-wrap:anywhere"><b>Alergias:</b> '+esc(f.alergias||"no registradas")+'<br><b>Medicación habitual:</b> '+esc(f.meds||"no registrada")+'<br><b>Condiciones de salud:</b> '+esc(f.cond||"no registradas")+'</p><div style="margin-top:12px"><button class="btn ghost s" data-a="ficha">Editar ficha</button></div></div>';
  h+='<div class="card"><h2>Teléfonos</h2>';
  var C=cuiTels();
  if(!C.length)h+='<p class="mut sm" style="margin-bottom:10px">Todavía no hay contactos cargados. Agregalos en la ficha de emergencia y en el Perfil.</p>';
  C.forEach(function(c){var n=tel(c[1]);
    h+=n?'<a class="btn ghost" style="margin-bottom:10px;overflow-wrap:anywhere" href="tel:'+esc(n)+'">'+esc(c[0])+' · '+esc(c[1])+'</a>':'<p class="sm" style="margin-bottom:10px;overflow-wrap:anywhere"><b>'+esc(c[0])+'</b> (sin teléfono)</p>';
  });
  h+=emergBtn()+'</div>';
  h+='<div class="card"><h2>Rutina de hoy</h2>';
  var L=S.rut||[];
  if(!L.length)h+='<p class="mut sm">Todavía no hay una rutina armada.</p>';
  RUT_M.forEach(function(mo){var I=L.filter(function(x){return x.m===mo[0]});if(!I.length)return;
    h+='<p class="eyebrow" style="margin-top:10px">'+mo[1]+'</p>';
    I.forEach(function(x){var on=x.d===td;h+='<p class="sm" style="margin:4px 0;overflow-wrap:anywhere;'+(on?"color:var(--mut);text-decoration:line-through":"")+'">'+(on?"✓ ":"· ")+esc(x.t)+'</p>'});
  });
  h+='<div style="margin-top:12px"><button class="btn ghost s" data-a="regt" data-v="rut">'+(L.length?"Abrir la rutina":"Armar la rutina")+'</button></div></div>';
  h+='<div class="row" style="margin-top:6px;gap:8px"><button class="btn ghost" data-a="cuic">Copiar la hoja</button><button class="btn ghost" data-a="cuih">Compartir</button></div>';
  h+='<p class="fine">Esta hoja no da indicaciones médicas. Ante una urgencia, llamá a emergencias.</p>';
  return h;
}
function cuiText(){
  var f=S.ficha||{},m=months(),T=S.tur||{},hy=turHoy(),td=today(),o=["HOJA PARA QUIEN CUIDA"+(S.name?" · "+S.name:"")];
  if(m!=null)o.push("Edad: "+ageLabel(m));
  if(T[hy])o.push("Hoy ("+TUR_D[hy].toLowerCase()+") cuida: "+T[hy]);
  if(S.cui)o.push("","Indicaciones de la familia:",S.cui);
  o.push("","Alergias: "+(f.alergias||"no registradas"),"Medicación habitual: "+(f.meds||"no registrada"),"Condiciones de salud: "+(f.cond||"no registradas"));
  o.push("","Teléfonos:");
  cuiTels().forEach(function(c){o.push(c[0]+": "+(c[1]||"sin teléfono"))});
  o.push("Emergencias: "+(S.emerg||"107"));
  var L=S.rut||[];
  if(L.length){o.push("","Rutina de hoy:");RUT_M.forEach(function(mo){var I=L.filter(function(x){return x.m===mo[0]});if(I.length){o.push(mo[1]+":");I.forEach(function(x){o.push((x.d===td?"[x] ":"[ ] ")+x.t)})}})}
  return o.join("\n");
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute("data-a")))t=t.parentNode;
  if(!t||t===document)return;
  var a=t.getAttribute("data-a");
  if(a==="cuis"||a==="cuic"||a==="cuih"){
    var e=document.getElementById("cu-n");if(e){S.cui=e.value.trim();save()}
    if(a==="cuic")copyTxt(cuiText(),t);else if(a==="cuih")shareTxt(cuiText(),"Hoja para quien cuida",t);else{t.textContent="Guardado"}
  }
});
document.addEventListener("click",function(){var e=document.getElementById("cu-n");if(e&&e.value.trim()!==(S.cui||"")){S.cui=e.value.trim();save()}},true);

/* ===== v0.20: cartas al nino ===== */
var carE=null;
function vCar(){
  var L=(S.car||[]).slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0}),nm=S.name?esc(S.name):"tu hijo o hija",ed=null;
  L.forEach(function(x){if(x.id===carE)ed=x});
  var h='<p class="eyebrow">Cartas</p><h1 class="h1" style="margin-bottom:6px">Cartas para '+nm+'</h1><p class="mut" style="margin-bottom:14px">Un lugar para escribirle lo que hoy sentís y para que lo lea más adelante. Quedan guardadas en este teléfono; si querés, copialas o compartilas. Es solo texto tuyo: la app no sugiere qué escribir.</p>';
  h+='<label class="f" for="ca-t">Título</label><input id="ca-t" type="text" maxlength="60" autocomplete="off" value="'+esc(ed?ed.t:"")+'" placeholder="Ej.: Para cuando seas grande">';
  h+='<label class="f" for="ca-f">Fecha</label><input id="ca-f" type="date" value="'+esc(ed?ed.d:today())+'">';
  h+='<label class="f" for="ca-x">Carta</label><textarea id="ca-x" rows="7" maxlength="3000" placeholder="Querido/a…">'+esc(ed?ed.x:"")+'</textarea>';
  h+='<div class="row" style="margin-top:12px;gap:8px"><button class="btn" data-a="cars">'+(ed?"Guardar cambios":"Guardar carta")+'</button>'+(ed?'<button class="chip" data-a="carn">Cancelar</button>':'')+'</div>';
  h+='<h2 style="margin-top:22px">Mis cartas'+(L.length?' ('+L.length+')':'')+'</h2>';
  if(!L.length)h+='<p class="mut">Todavía no escribiste ninguna carta.</p>';
  L.forEach(function(x){
    h+='<div class="card"><p class="mut sm" style="margin:0">'+esc(fmtDate(utc(x.d)))+'</p><p style="margin:2px 0 6px;font-weight:700;overflow-wrap:anywhere">'+esc(x.t||"Sin título")+'</p><p class="sm" style="white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 10px">'+esc(x.x)+'</p><div class="row" style="gap:8px"><button class="chip" data-a="care" data-id="'+esc(x.id)+'">Editar</button><button class="chip" data-a="carc" data-id="'+esc(x.id)+'">Copiar</button><button class="chip" data-a="carh" data-id="'+esc(x.id)+'">Compartir</button><button class="chip" data-a="carr" data-id="'+esc(x.id)+'">Quitar</button></div></div>';
  });
  return h;
}
function carText(x){return (x.t||"Sin título")+"\n"+fmtDate(utc(x.d))+"\n\n"+x.x}
document.addEventListener("click",function(ev){
  var t=ev.target;
  while(t&&t!==document&&!(t.getAttribute&&t.getAttribute("data-a")))t=t.parentNode;
  if(!t||t===document)return;
  var a=t.getAttribute("data-a"),id=t.getAttribute("data-id");
  if(a.indexOf("car")!==0)return;
  var L=S.car||[],it=null;L.forEach(function(x){if(x.id===id)it=x});
  if(a==="cars"){
    var tt=document.getElementById("ca-t"),ff=document.getElementById("ca-f"),xx=document.getElementById("ca-x");
    var v=xx?xx.value.trim():"";if(!v)return;
    var d=ff&&ff.value?ff.value:today(),ti=tt?tt.value.trim():"";
    if(carE){L.forEach(function(x){if(x.id===carE){x.t=ti;x.d=d;x.x=v}})}
    else{L.push({id:bagId(),t:ti,d:d,x:v})}
    S.car=L;carE=null;save();render(true);
  }
  else if(a==="carn"){carE=null;render(true)}
  else if(a==="care"&&it){carE=id;render(true);window.scrollTo(0,0)}
  else if(a==="carc"&&it){copyTxt(carText(it),t)}
  else if(a==="carh"&&it){shareTxt(carText(it),it.t||"Carta",t)}
  else if(a==="carr"&&it){if(confirm("¿Quitar esta carta? No se puede deshacer.")){S.car=L.filter(function(x){return x.id!==id});if(carE===id)carE=null;save();render(true)}}
});

/* ===== v0.14: recuerdos del album en el resumen para la consulta ===== */
function resumen(){
  var tx=resumenBase(),lim=Date.now()-30*864e5;
  var L=(S.alb||[]).filter(function(e){return e.d&&utc(e.d)>=lim}).sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:0});
  if(!L.length)return tx;
  var o=["","Momentos anotados por la familia (últimos 30 días):"];
  L.forEach(function(e){var ed=albAge(e.d);o.push(fmtDate(utc(e.d))+" · "+e.t+(ed?" ("+ed+")":"")+(e.n?": "+e.n:""))});
  var mark="\n\nRegistrado por la familia";
  var i=tx.lastIndexOf(mark);
  return i<0?tx+"\n"+o.join("\n"):tx.slice(0,i)+"\n"+o.join("\n")+tx.slice(i);
}

})();
